name: SS OIL PC Tek EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'SS_OIL_PC_8767_KASA_VARDIYA_DIAGNOSTIK.zip'
      - '.github/workflows/windows-exe.yml'
      - 'pc/load_existing_config.py'
      - 'pc/patch_shift_sync.py'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract PC source
        shell: pwsh
        run: |
          if (!(Test-Path 'SS_OIL_PC_8767_KASA_VARDIYA_DIAGNOSTIK.zip')) { throw 'Diagnostik kaynak ZIP dosyasi S4 ana dizininde yok' }
          Expand-Archive -LiteralPath 'SS_OIL_PC_8767_KASA_VARDIYA_DIAGNOSTIK.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'pc/vardiya_entegre.py')) {
            Expand-Archive -LiteralPath 'SS_OIL_PC_8767_TEK_PROGRAM_VARDIYA_KAYNAK (1).zip' -DestinationPath 'vardiya_source' -Force
            $shift = Get-ChildItem -LiteralPath 'vardiya_source' -Recurse -Filter 'vardiya_entegre.py' | Select-Object -First 1
            if (!$shift) { throw 'vardiya_entegre.py missing from both source ZIP archives' }
            Copy-Item -LiteralPath $shift.FullName -Destination 'pc/vardiya_entegre.py'
          }
          if (!(Test-Path 'pc/vardiya_entegre.py')) { throw 'Shift module absent, refusing broken EXE' }
      - name: Fix bidirectional shift cloud pull
        run: python pc/patch_shift_sync.py
      - name: Integrate existing local bridge settings
        shell: pwsh
        run: |
          $entry = 'pc/SSOIL_Server.py'
          $source = Get-Content -LiteralPath $entry -Raw
          if (!$source.Contains('load_existing_config.load()')) {
            $source = $source.Replace("import merkez", "import load_existing_config; load_existing_config.load()" + [Environment]::NewLine + "import merkez")
            Set-Content -LiteralPath $entry -Value $source -Encoding UTF8
          }
      - name: Install dependencies
        working-directory: pc
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows executable
        working-directory: pc
        run: python -m PyInstaller --noconfirm --clean --onefile --name SSOIL_Server --hidden-import load_existing_config --hidden-import merkez_arsiv --hidden-import ssoil_kasa_ek --hidden-import vardiya_entegre --hidden-import pyodbc SSOIL_Server.py
      - name: Add crash diagnostic launcher
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          echo SS OIL merkez baslatiliyor...
          "SSOIL_Server.exe" > "SSOIL_START_LOG.txt" 2>&1
          echo.
          echo Program kapandi. Hata kaydi:
          type "SSOIL_START_LOG.txt"
          echo.
          pause
          '@ | Set-Content -LiteralPath 'pc/dist/BASLAT_HATA_GOSTER.bat' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SS_OIL_PC_TEK_EXE
          path: |
            pc/dist/SSOIL_Server.exe
            pc/dist/BASLAT_HATA_GOSTER.bat
          if-no-files-found: error
