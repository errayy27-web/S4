name: SS OIL PC Tek EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'SS_OIL_PC_8767_TEK_PROGRAM_VARDIYA_KAYNAK.zip'
      - '.github/workflows/windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract PC source
        shell: pwsh
        run: |
          if (!(Test-Path 'SS_OIL_PC_8767_TEK_PROGRAM_VARDIYA_KAYNAK.zip')) { throw 'Kaynak ZIP dosyasi S4 ana dizininde yok' }
          Expand-Archive -LiteralPath 'SS_OIL_PC_8767_TEK_PROGRAM_VARDIYA_KAYNAK.zip' -DestinationPath '.' -Force
      - name: Install dependencies
        working-directory: pc
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows executable
        working-directory: pc
        run: python -m PyInstaller --noconfirm --clean --onefile --name SSOIL_Server --hidden-import merkez_arsiv --hidden-import ssoil_kasa_ek --hidden-import vardiya_entegre --hidden-import pyodbc SSOIL_Server.py
      - uses: actions/upload-artifact@v4
        with:
          name: SS_OIL_PC_TEK_EXE
          path: pc/dist/SSOIL_Server.exe
          if-no-files-found: error
